info:
  contact: {}
  description: This API was built with FastAPI to deal with prescaling recordings
    in CRD
  title: Prescaling API
  version: 1.0.0
paths:
  /api/v1/events/:
    get:
      consumes:
      - application/json
      description: List all prescaling Events
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.PrescalingEventOutput'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
      summary: List all prescaling Events
      tags:
      - prescalingevent
    post:
      consumes:
      - application/json
      description: Create a prescaling Event
      parameters:
      - description: The Request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PrescalingEventOutput'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Create a prescaling Event
      tags:
      - prescalingevent
  /api/v1/events/{name}:
    delete:
      consumes:
      - application/json
      description: Delete a prescaling Event by name
      parameters:
      - description: event-name-1
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Delete a prescaling Event by name
      tags:
      - prescalingevent
    get:
      consumes:
      - application/json
      description: Get a prescaling Events by name
      parameters:
      - description: event-name-1
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PrescalingEventOutput'
        "404":
          description: Not Found
          schema:
            type: string
      summary: Get a prescaling Events by name
      tags:
      - prescalingevent
    put:
      consumes:
      - application/json
      description: Update a prescaling Event by name
      parameters:
      - description: The Request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateDTO'
      - description: event-name-1
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PrescalingEventOutput'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Update a prescaling Event by name
      tags:
      - prescalingevent
  /api/v1/events/current/:
    get:
      consumes:
      - application/json
      description: Get current prescaling Event
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PrescalingEventOutput'
        "204":
          description: No Content
          schema:
            type: string
      summary: Get current prescaling Event
      tags:
      - prescalingevent
  /api/v1/hpas:
    get:
      consumes:
      - application/json
      description: Checks if all HPAs in the cluster have at least the minimum number
        of running pods
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.HPAMinimumStatus'
      summary: Check if HPAs meet their required minimums
      tags:
      - cluster
  /api/v1/hpas/check:
    get:
      consumes:
      - application/json
      description: Checks if the platform is correctly scaled and returns HPA details
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.PlatformScalingStatus'
      summary: Check the platform scaling status
      tags:
      - cluster
swagger: "2.0"
