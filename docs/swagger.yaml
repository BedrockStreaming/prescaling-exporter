definitions:
  handlers.CreateDTO:
    properties:
      date:
        example: "2022-05-25"
        type: string
      description:
        example: a good description
        type: string
      end_time:
        example: "23:59:59"
        type: string
      multiplier:
        example: 2
        type: integer
      name:
        example: prescaling-event-1
        type: string
      start_time:
        example: "20:00:00"
        type: string
    type: object
  handlers.UpdateDTO:
    properties:
      date:
        example: "2022-05-25"
        type: string
      description:
        example: a good description
        type: string
      end_time:
        example: "23:59:59"
        type: string
      multiplier:
        example: 2
        type: integer
      name:
        example: prescaling-event-1
        type: string
